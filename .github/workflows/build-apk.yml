name: Build Nice Multimedia APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Connect native media sources and plugins
        run: node scripts/integrate-native-media.cjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Enforce offline-only manifest
        run: node scripts/strip-internet-permission.cjs

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nice-multimedia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
